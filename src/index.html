<!doctype html>
<!--
  `dir` is stated rather than left to default. The dashboard is English-only for
  now while the phone app carries 705 EN+AR keys, so this is honestly `ltr` —
  but the layout is built from logical properties throughout, so flipping this
  one attribute is what mirroring will cost when Arabic lands.
-->
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <title>Kitto</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The ghost, so the browser tab matches the sidebar. The .ico stays as a
       fallback for anything that ignores the png. -->
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="alternate icon" type="image/x-icon" href="favicon.ico">

  <!--
    Fraunces + Nunito, the pairing that carries Kitto's identity. Both are
    variable fonts; Fraunces needs its SOFT/WONK axes, which styles.css sets.

    `display=swap` on purpose: the dashboard's first paint is a sidebar and a
    table, and a blocked render waiting on a webfont is worse than one frame of
    the system stack. The two preconnects are what keep that frame short.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Nunito:wght@400..800&display=swap"
    rel="stylesheet">

  <!--
    Set the palette BEFORE first paint.

    ThemeStore does this properly once Angular boots, but "once Angular boots"
    is several hundred milliseconds of white screen for a dark-mode user — and a
    flash of the wrong palette is the single most noticeable bug a themed app
    can ship. This runs synchronously in <head>, so the class is on <html>
    before the browser paints anything.

    Deliberately duplicated logic, not shared: a module import would defeat the
    point by being async. It reads the same storage key and the same media
    query, and ThemeStore takes over seamlessly because it computes the same
    answer.
  -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('lifeadmin.theme');
        var dark =
          stored === 'dark' ||
          (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {
        /* storage disabled — fall through to light, which is the default */
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
